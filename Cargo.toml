[[bin]]
name = "PlantStation"
path = "src/main.rs"

[package]
name = "PlantStation"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "PlantStation - Protocol Buffer based IoT monitoring system"
authors = ["PlantStation Contributors"]
license = "MIT"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
i2c-linux = "0.1.2"
json = "0.12.4"
bit-vec = "0.8.0"
log = "0.4.29"
prost = "0.12"
bytes = "1.5"

[build-dependencies]
prost-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

